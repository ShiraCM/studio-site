<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 860" width="900" height="860" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Bathroom with a tub. Scale: 1 cm = 3 px. Interior 220 x 180 cm at (140,160)-(800,700). -->
  <defs>
    <clipPath id="room"><rect x="140" y="160" width="660" height="540"/></clipPath>
    <marker id="tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 9 L9 1" stroke="#6b6660" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="900" height="860" fill="#ffffff"/>

  <!-- floor: large-format tiles, 60 x 120 cm -->
  <g clip-path="url(#room)" stroke="#e7e4de" stroke-width="1">
    <rect x="140" y="160" width="660" height="540" fill="#faf9f6" stroke="none"/>
    <path d="M320 160V700M500 160V700M680 160V700M140 340H800M140 520H800"/>
  </g>

  <!-- walls -->
  <g fill="#2b2926">
    <rect x="95" y="115" width="45" height="630"/>          <!-- left -->
    <rect x="800" y="115" width="45" height="630"/>         <!-- right -->
    <rect x="95" y="115" width="195" height="45"/>          <!-- top, left of window -->
    <rect x="590" y="115" width="255" height="45"/>         <!-- top, right of window -->
    <rect x="95" y="700" width="225" height="45"/>          <!-- bottom, left of door -->
    <rect x="560" y="700" width="285" height="45"/>         <!-- bottom, right of door -->
  </g>

  <!-- frosted window -->
  <g fill="none" stroke="#2b2926" stroke-width="1.5">
    <rect x="290" y="115" width="300" height="45" fill="#ffffff"/>
    <line x1="290" y1="132" x2="590" y2="132"/>
    <line x1="290" y1="143" x2="590" y2="143"/>
    <line x1="440" y1="132" x2="440" y2="143"/>
  </g>

  <!-- door: 80 cm, hinged on the right, opening into the room -->
  <g fill="none" stroke="#2b2926">
    <line x1="560" y1="700" x2="560" y2="460" stroke-width="3"/>
    <path d="M320 700 A240 240 0 0 1 560 460" stroke-width="1" stroke-dasharray="5 4"/>
  </g>

  <!-- tub: 80 x 170 cm with a tiled ledge behind -->
  <g stroke="#2b2926" stroke-width="1.6">
    <rect x="560" y="160" width="240" height="30" fill="#efede8"/>
    <rect x="560" y="190" width="240" height="510" fill="#ffffff"/>
    <rect x="584" y="214" width="192" height="462" rx="34" fill="#f6f5f2" stroke-width="1.3"/>
    <circle cx="680" cy="640" r="8" fill="none" stroke-width="1.3"/>
    <rect x="792" y="430" width="8" height="34" fill="#b07a4f" stroke="none"/>
  </g>
  <!-- fixed glass screen -->
  <line x1="562" y1="190" x2="562" y2="430" stroke="#7d93a0" stroke-width="5" stroke-linecap="round"/>

  <!-- wall-hung toilet, centred under the window -->
  <g stroke="#2b2926" stroke-width="1.6" fill="#ffffff">
    <rect x="404" y="160" width="72" height="20"/>
    <path d="M386 180 H494 V250 C494 300 470 322 440 322 C410 322 386 300 386 250 Z"/>
    <path d="M404 196 H476 V250 C476 286 460 302 440 302 C420 302 404 286 404 250 Z" stroke-width="1.2"/>
  </g>
  <rect x="425" y="160" width="30" height="6" fill="#b07a4f"/>

  <!-- vanity: 45 x 80 cm on the left wall, integrated basin -->
  <g stroke="#2b2926" stroke-width="1.6">
    <rect x="140" y="460" width="135" height="240" fill="#ffffff"/>
    <rect x="160" y="500" width="92" height="160" rx="12" fill="#f6f5f2" stroke-width="1.3"/>
    <circle cx="206" cy="580" r="6" fill="none" stroke-width="1.2"/>
  </g>
  <rect x="140" y="574" width="10" height="12" fill="#b07a4f"/>
  <!-- lit mirror above the vanity -->
  <line x1="146" y1="465" x2="146" y2="695" stroke="#c9a46c" stroke-width="4" stroke-linecap="round" opacity=".9"/>

  <!-- labels -->
  <g fill="#6b6660" font-size="15" letter-spacing="1.5" text-anchor="middle">
    <text x="680" y="455">BATH</text>
    <text x="207" y="440">VANITY</text>
    <text x="440" y="360">WC</text>
    <text x="440" y="100">FROSTED WINDOW</text>
  </g>

  <!-- dimensions (cm) -->
  <g stroke="#6b6660" stroke-width="1" fill="none">
    <line x1="140" y1="60" x2="800" y2="60" marker-start="url(#tick)" marker-end="url(#tick)"/>
    <line x1="140" y1="52" x2="140" y2="110"/><line x1="800" y1="52" x2="800" y2="110"/>
    <line x1="140" y1="800" x2="800" y2="800" marker-start="url(#tick)" marker-end="url(#tick)"/>
    <path d="M316 804 L324 796 M556 804 L564 796" stroke-width="1.4"/>
    <line x1="320" y1="750" x2="320" y2="808"/><line x1="560" y1="750" x2="560" y2="808"/>
    <line x1="140" y1="750" x2="140" y2="808"/><line x1="800" y1="750" x2="800" y2="808"/>
    <line x1="50" y1="160" x2="50" y2="700" marker-start="url(#tick)" marker-end="url(#tick)"/>
    <line x1="42" y1="160" x2="90" y2="160"/><line x1="42" y1="700" x2="90" y2="700"/>
  </g>
  <g fill="#3a3632" font-size="17" text-anchor="middle">
    <text x="470" y="52">220</text>
    <text x="230" y="826">60</text>
    <text x="440" y="826">80</text>
    <text x="680" y="826">80</text>
    <text x="40" y="436" transform="rotate(-90 40 430)">180</text>
  </g>
</svg>
